<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大富豪</title>
<link rel="icon" href="/static/icon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ===== タイトル ===== -->
<section id="screen-title" class="screen">
  <div class="title-wrap">
    <div class="logo">
      <div class="logo-cards"><span class="lc lc1">♠</span><span class="lc lc2">♥</span><span class="lc lc3">♦</span><span class="lc lc4">♣</span></div>
      <h1>大富豪</h1>
      <div class="logo-sub">ONLINE BATTLE</div>
    </div>
    <div class="panel title-panel">
      <label class="field-label">プレイヤー名</label>
      <input id="in-name" maxlength="12" placeholder="名前を入力">
      <button id="btn-create" class="btn btn-gold big">部屋を作る</button>
      <div class="join-row">
        <select id="sel-solo-cpus" title="CPUの人数">
          <option value="1">CPU 1人</option><option value="2">CPU 2人</option><option value="3" selected>CPU 3人</option>
          <option value="4">CPU 4人</option><option value="5">CPU 5人</option>
        </select>
        <button id="btn-solo" class="btn btn-dark" style="flex:1">ひとりで遊ぶ</button>
      </div>
      <div class="join-row">
        <input id="in-code" maxlength="4" placeholder="部屋番号(4桁)" inputmode="numeric">
        <button id="btn-join" class="btn btn-blue">参加</button>
      </div>
      <div class="room-list-head">公開中の部屋 <button id="btn-refresh" class="btn-mini">更新</button></div>
      <div id="room-list" class="room-list"></div>
      <a id="link-home" class="link-home hidden" href="#">← ランチャーに戻る</a>
    </div>
  </div>
</section>

<!-- ===== ロビー ===== -->
<section id="screen-lobby" class="screen hidden">
  <div class="lobby">
    <header class="lobby-head">
      <div>
        <div class="room-code-label">部屋番号</div>
        <div class="room-code-row"><div id="lobby-code" class="room-code">----</div><button id="btn-copy-code" class="copy-btn">コピー</button></div>
      </div>
      <div class="lobby-addr" id="lobby-addr"></div>
      <button id="btn-leave" class="btn btn-dark">退室</button>
    </header>
    <div class="lobby-body">
      <!-- 左：プレイヤー・チャット -->
      <div class="lobby-col">
        <div class="panel lobby-seats">
          <h2>プレイヤー <span id="seat-count"></span></h2>
          <div id="seats" class="seats"></div>
          <div id="bot-row" class="set-row"><span>CPUの人数</span><select id="sel-bots"></select></div>
        </div>
        <div class="panel lobby-chat">
          <h2>チャット</h2>
          <div id="lobby-chat-log" class="chat-log"></div>
          <form id="lobby-chat-form" class="chat-form"><input maxlength="100" placeholder="メッセージ"><button class="btn btn-blue">送信</button></form>
        </div>
      </div>
      <!-- 中央：対戦設定・開始 -->
      <div class="panel lobby-settings">
        <h2>対戦設定 <span id="host-only" class="muted small"></span></h2>
        <div class="mode-cards" id="mode-cards"></div>
        <div class="set-row">
          <span>ラウンド数</span>
          <select id="sel-rounds"></select>
        </div>
        <div class="set-row">
          <span>持ち時間 <small class="muted">（使い切ると毎手番5秒）</small></span>
          <select id="sel-time"></select>
        </div>
        <div class="set-row">
          <span>残りがCPUだけになったら<br>ラウンド終了までスキップ</span>
          <label class="switch"><input type="checkbox" id="chk-skip"><i></i></label>
        </div>
        <div class="base-rules">基本ルール：革命あり ／ 階段は同じスート3枚から ／ ジョーカー1枚 ／ スペ3返し</div>
        <div class="grow"></div>
        <button id="btn-start" class="btn btn-gold big">対戦開始</button>
      </div>
      <!-- 右：追加ルール・上がり方 -->
      <div class="panel lobby-rules">
        <h2>追加ルール</h2>
        <div id="rule-area"></div>
        <h2>上がり方の指定 <span class="muted small">（禁止された上がり方をすると最下位）</span></h2>
        <div id="finish-area"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== ゲーム ===== -->
<section id="screen-game" class="screen hidden">
  <div id="table" class="table">
    <div class="table-felt"></div>
    <div class="table-ring"></div>
    <div class="topbar">
      <div class="round-info"><span id="g-round">第1回戦</span><span id="g-mode" class="mode-badge"></span></div>
      <div id="g-status" class="status-chips"></div>
      <div class="top-btns">
        <button id="btn-rules" class="btn-mini">ルール</button>
        <button id="btn-score" class="btn-mini">成績</button>
        <button id="btn-log" class="btn-mini">ログ</button>
        <button id="btn-game-leave" class="btn-mini">退室</button>
      </div>
    </div>
    <div id="ticker" class="ticker"></div>
    <div id="secret-box" class="secret-box hidden"></div>
    <div id="rule-panel" class="rule-panel"></div>
    <div id="opponents"></div>
    <div id="field" class="field">
      <div id="pile" class="pile"></div>
      <div id="field-cards" class="field-cards"></div>
      <div id="field-owner" class="field-owner"></div>
    </div>
    <div id="banner" class="banner"></div>
    <button id="btn-result" class="btn btn-gold btn-result hidden">結果を表示</button>

    <div class="my-area">
      <div id="prompt" class="prompt hidden"><span id="prompt-text"></span><button id="btn-prompt-ok" class="btn btn-gold">決定</button></div>
      <div id="turn-indicator" class="turn-indicator hidden">あなたの番です</div>
      <div class="my-plate" id="my-plate"></div>
      <div id="hand" class="hand"></div>
      <div class="my-btns">
        <button id="btn-play" class="btn btn-play">出す</button>
        <button id="btn-pass" class="btn btn-pass">パス</button>
        <button id="btn-clear" class="btn-mini">選択解除</button>
      </div>
    </div>

    <aside id="log-panel" class="log-panel hidden">
      <div class="log-tabs"><b>ログ / チャット</b><button id="btn-log-close" class="btn-mini">×</button></div>
      <div id="game-log" class="chat-log"></div>
      <form id="game-chat-form" class="chat-form"><input maxlength="100" placeholder="チャット"><button class="btn btn-blue">送信</button></form>
    </aside>
  </div>
</section>

<!-- ===== モーダル ===== -->
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast"></div>
<div id="reconnect" class="reconnect hidden">サーバーに再接続しています…</div>

<script src="/static/app.js"></script>
</body>
</html>
